services:
  otelcol:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otelcol/config.yaml"]
    expose:
      - "4317"
      - "4318"
    user: "0:0"
    volumes:
      - ./test-config/otelcol-test.yaml:/etc/otelcol/config.yaml:ro
      - mysql-test-logs:/var/log/test-services/mysql:ro
      - nginx-test-logs:/var/log/test-services/nginx:ro
      - redis-test-logs:/var/log/test-services/redis:ro
    depends_on:
      - alloy
      - mysql-exporter
      - nginx-exporter
      - redis-exporter
      - node-exporter
    restart: unless-stopped

  mysql:
    image: mysql:latest
    command:
      - --general-log=1
      - --log-output=FILE
      - --general-log-file=/var/log/mysql/general.log
      - --log-error=/var/log/mysql/error.log
    environment:
      MYSQL_ROOT_PASSWORD: test-root-password
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-test-logs:/var/log/mysql

  mysql-exporter:
    image: prom/mysqld-exporter:latest
    command:
      - --config.my-cnf=/etc/mysql-exporter.cnf
      - --mysqld.address=mysql:3306
    volumes:
      - ./test-config/mysql-exporter.cnf:/etc/mysql-exporter.cnf:ro
    depends_on:
      - mysql

  nginx:
    image: nginx:latest
    volumes:
      - ./test-config/test-nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-test-logs:/var/log/nginx

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:latest
    command: ["--nginx.scrape-uri=http://nginx/stub_status"]
    depends_on:
      - nginx

  redis:
    image: redis:latest
    command: ["redis-server", "--logfile", "/data/redis.log", "--loglevel", "notice"]
    volumes:
      - redis-test-logs:/data

  redis-exporter:
    image: oliver006/redis_exporter:latest
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      - redis

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro

volumes:
  mysql-test-logs:
  nginx-test-logs:
  redis-test-logs:
