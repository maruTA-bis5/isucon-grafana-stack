services:
  tempo:
    image: grafana/tempo:3.1.0
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"
      - "4317:4317"                                   # Collector OTLP/gRPC traces endpoint: tempo:4317
      - "4318:4318"                                   # Collector OTLP/HTTP traces endpoint: http://tempo:4318
    restart: always

  loki:
    image: grafana/loki:3.7.8
    command: [ "-config.file=/etc/loki/loki-config.yaml" ]
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    ports:
      - "3100:3100"                                   # Collector OTLP/HTTP logs endpoint: http://loki:3100/otlp
    restart: always

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"                                   # Collector OTLP/HTTP metrics endpoint: http://prometheus:9090/api/v1/otlp
    restart: always

  grafana:
    image: grafana/grafana-enterprise:13.2.3
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    restart: always
