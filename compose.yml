services:
  alloy:
    image: grafana/alloy:v1.20.1
    command: [ "run", "/etc/alloy/config.alloy" ]
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    ports:
      # OTLP ingress for all signals from trusted hosts; restrict access with a firewall.
      - "4317:4317"                                   # OTLP/gRPC: <stack-host>:4317
      - "4318:4318"                                   # OTLP/HTTP: http://<stack-host>:4318
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: always

  tempo:
    image: grafana/tempo:3.1.0
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
    restart: always

  loki:
    image: grafana/loki:3.7.8
    command: [ "-config.file=/etc/loki/loki-config.yaml" ]
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    restart: always

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

  grafana:
    image: grafana/grafana-enterprise:13.2.3
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - "3000:3000"
    restart: always
