services:
  alloy:
    image: grafana/alloy:v1.20.1
    command: [ "run", "/etc/alloy/config.alloy" ]
    volumes:
      - ./config/alloy/config.alloy:/etc/alloy/config.alloy:ro
    environment:
      ALLOY_OTLP_USERNAME: "${ALLOY_OTLP_USERNAME:-otlp-user}"
      ALLOY_OTLP_PASSWORD: "${ALLOY_OTLP_PASSWORD:-otlp-password}"
    ports:
      # Defaults to loopback; set ALLOY_BIND_IP to a reachable NIC IP for remote senders.
      - "${ALLOY_BIND_IP:-127.0.0.1}:4317:4317"       # OTLP/gRPC: <stack-host>:4317
      - "${ALLOY_BIND_IP:-127.0.0.1}:4318:4318"       # OTLP/HTTP: http://<stack-host>:4318
    depends_on:
      - tempo
      - loki
      - prometheus
    restart: always

  tempo:
    image: grafana/tempo:3.1.0
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./config/tempo.yaml:/etc/tempo.yaml:ro
    restart: always

  loki:
    image: grafana/loki:3.7.8
    command: [ "-config.file=/etc/loki/loki-config.yaml" ]
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
    restart: always

  prometheus:
    image: prom/prometheus:v3.15.0
    command:
      - --enable-feature=exemplar-storage
      - --web.enable-remote-write-receiver
      - --web.enable-otlp-receiver
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: always

  grafana:
    image: grafana/grafana-enterprise:13.2.3
    volumes:
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
    environment:
      - GF_AUTH_GITHUB_ENABLED=${GF_AUTH_GITHUB_ENABLED}
      - GF_AUTH_GITHUB_CLIENT_ID=${GF_AUTH_GITHUB_CLIENT_ID}
      - GF_AUTH_GITHUB_CLIENT_SECRET=${GF_AUTH_GITHUB_CLIENT_SECRET}
      - GF_AUTH_GITHUB_ALLOWED_ORGANIZATIONS=${GF_AUTH_GITHUB_ALLOWED_ORGANIZATIONS}
      - GF_AUTH_GITHUB_ROLE_ATTRIBUTE_PATH=${GF_AUTH_GITHUB_ROLE_ATTRIBUTE_PATH}
      - GF_AUTH_GITHUB_SKIP_ORG_ROLE_SYNC=${GF_AUTH_GITHUB_SKIP_ORG_ROLE_SYNC}
      - GF_SERVER_DOMAIN=${GF_SERVER_DOMAIN}
    ports:
      - "3000:3000"
    restart: always
